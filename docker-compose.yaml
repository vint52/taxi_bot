services:
  tg:
    container_name: taxi_bot
    restart: unless-stopped
    build:
      context: ./src
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./logs:/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - taxi_network

  redis:
    container_name: taxi_redis
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "/conf/master.conf", "--requirepass", "${RDS_PASSWORD}"]
    volumes:
      - ./redis/conf:/conf:ro
      - ./redis/data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${RDS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    environment:
      - RDS_PASSWORD=${RDS_PASSWORD}
    networks:
      - taxi_network

networks:
  taxi_network:
    driver: bridge
